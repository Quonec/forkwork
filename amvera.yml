# Конфигурация деплоя для Amvera Cloud.
# Сборка идёт по Dockerfile из корня репозитория.
meta:
  environment: docker
  toolchain:
    name: docker

run:
  # Порт, который слушает приложение (next start → 3000).
  containerPort: 3000
  # Постоянный том монтируется сюда. Это же значение DATA_DIR в Dockerfile:
  # там лежат база forkwork.db и секретное хранилище чатов (secret/).
  # Без тома всё обнулялось бы при каждом перезапуске контейнера.
  persistenceMount: /data
